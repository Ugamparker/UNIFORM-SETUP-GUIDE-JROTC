<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>JROTC Uniform Setup Guide</title><style>
body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui;padding:18px}main{max-width:1000px;margin:auto}.box{background:#141d33;border:1px solid #34446b;border-radius:16px;padding:18px;margin:12px 0}select,button{padding:12px;border-radius:10px;background:#0b1224;color:white;border:1px solid #40527d;margin:5px}button{cursor:pointer}.row{display:flex;gap:12px;flex-wrap:wrap}.uniform{height:520px;max-width:430px;margin:auto;position:relative;background:#263653;border:2px solid #65779f;border-radius:20px}.collar{position:absolute;top:15px;left:38%;width:24%;height:65px;background:#1b2944;clip-path:polygon(0 0,100% 0,70% 100%,50% 70%,30% 100%)}.pocket{position:absolute;top:150px;width:32%;height:70px;border:2px solid #7182a8}.pocket.l{left:8%}.pocket.r{right:8%}.ribbons{position:absolute;left:11%;top:190px}.ribbon{width:65px;height:12px;margin:3px;background:linear-gradient(90deg,#c33 0 25%,#eee 25% 50%,#3570c8 50% 75%,#dbb83e 75%)}.medals{position:absolute;right:14%;top:190px;display:flex;gap:4px}.medal{width:25px;height:25px;border-radius:50%;background:#c3c6ce;border:2px solid #eee}.rank{position:absolute;top:105px;left:50%;transform:translateX(-50%);background:#eee;color:#17213a;padding:5px;border-radius:4px;font-size:11px;font-weight:bold}.items{display:flex;overflow:auto;gap:8px}.item{min-width:120px;text-align:center;padding:10px;border:1px solid #40527d;border-radius:10px}.note{color:#aeb9d1;font-size:13px}
</style></head><body><main><div class="box"><h1>JROTC Uniform Setup Guide</h1><p>Select a service and uniform, then add rank, ribbons, medals, or badges.</p><div class="row"><select id="service"></select><select id="uniform"></select></div><p class="note">Use your current official service/JROTC regulation and unit guidance to verify exact measurements before inspection.</p></div><div class="box"><div id="tabs"></div><div class="items" id="items"></div></div><div class="box"><div class="uniform" id="u"><div class="collar"></div><div class="pocket l"></div><div class="pocket r"></div><div class="ribbons" id="r"></div><div class="medals" id="m"></div></div><h2 id="name"></h2><ul id="guide"></ul><button onclick="clearAll()">Clear</button></div></main><script>
const D={Army:["Class A / Service Dress","Class B / Shirt"],Navy:["Service Dress Blue","Navy Service Uniform","Working Khaki"],"Air Force":["Class A / Service Dress","Class B / Blue Shirt"],"Marine Corps:["Blue Coat","Khaki Shirt"],"Coast Guard:["Tropical Blue Short Sleeve","Operational Dress Uniform"],"Space Force:["Service Dress","Semi-Formal Dress"]};let S=document.querySelector("#service"),U=document.querySelector("#uniform"),tab=document.querySelector("#tabs"),items=document.querySelector("#items"),R=document.querySelector("#r"),M=document.querySelector("#m"),state={rank:false,r:0,m:0,b:0};Object.keys(D).forEach(x=>S.add(new Option(x,x)));function load(){U.innerHTML="";D[S.value].forEach(x=>U.add(new Option(x,x)));render("Rank")}S.onchange=load;U.onchange=()=>render("Rank");function render(t){tab.innerHTML=["Rank","Ribbons","Medals","Badges"].map(x=>`<button onclick="render('${x}')">${x}</button>`).join("");items.innerHTML="";let n=t==="Ribbons"?6:t==="Medals"?3:t==="Badges"?3:1;for(let i=1;i<=n;i++){let d=document.createElement("div");d.className="item";d.innerHTML=`<b>${t} ${i}</b><button>Add</button>`;d.querySelector("button").onclick=()=>add(t);items.append(d)}document.querySelector("#name").textContent=S.value+" — "+U.value;document.querySelector("#guide").innerHTML="<li>Follow the current regulation for this exact uniform.</li><li>Confirm measurements and authorized awards with your JROTC unit before inspection.</li>"}function add(t){if(t==="Rank")state.rank=true;if(t==="Ribbons")state.r++;if(t==="Medals")state.m++;draw()}function draw(){document.querySelector(".rank")?.remove();if(state.rank){let x=document.createElement("div");x.className="rank";x.textContent="RANK";document.querySelector("#u").append(x)}R.innerHTML="";for(let i=0;i<state.r;i++)R.innerHTML+='<div class="ribbon"></div>';M.innerHTML="";for(let i=0;i<state.m;i++)M.innerHTML+='<div class="medal"></div>'}function clearAll(){state={rank:false,r:0,m:0,b:0};draw()}load();
</script></body></html>
